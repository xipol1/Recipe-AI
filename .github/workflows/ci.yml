name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (merge gate)
        run: npm run lint

      - name: Test (merge gate)
        env:
          NODE_ENV: test
        run: npm test

      - name: Build (merge gate)
        run: npm run build
